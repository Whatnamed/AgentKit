name: Build AgentKit Plugins

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable plugin ZIPs
        run: python scripts/build-plugins.py
      - name: Upload plugin archives
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-plugin-bundles
          path: dist/plugins/*.zip
          if-no-files-found: error
